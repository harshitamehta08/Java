<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Calculator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1e1e2f, #2b2b45);
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .calculator {
    width: 320px;
    background: #24243a;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  }
  .display {
    background: #16161f;
    border-radius: 12px;
    padding: 20px 16px;
    margin-bottom: 16px;
    text-align: right;
    overflow: hidden;
  }
  .display .prev {
    color: #8888a0;
    font-size: 16px;
    min-height: 20px;
  }
  .display .current {
    color: #fff;
    font-size: 36px;
    font-weight: 500;
    word-wrap: break-word;
  }
  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  button {
    border: none;
    border-radius: 12px;
    font-size: 20px;
    padding: 18px 0;
    cursor: pointer;
    background: #35354f;
    color: #fff;
    transition: transform 0.06s ease, background 0.15s ease;
  }
  button:active { transform: scale(0.95); }
  button:hover { background: #40405c; }
  button.operator {
    background: #ff9f43;
    color: #1e1e2f;
    font-weight: 600;
  }
  button.operator:hover { background: #ffb066; }
  button.equals {
    background: #4ecdc4;
    color: #1e1e2f;
    font-weight: 700;
    grid-column: span 2;
  }
  button.equals:hover { background: #66d8d0; }
  button.clear, button.delete {
    background: #ff6b6b;
    color: #1e1e2f;
    font-weight: 600;
  }
  button.clear:hover, button.delete:hover { background: #ff8787; }
  button.zero { grid-column: span 2; }
</style>
</head>
<body>

<div class="calculator">
  <div class="display">
    <div class="prev" id="prevOperand"></div>
    <div class="current" id="currentOperand">0</div>
  </div>
  <div class="buttons">
    <button class="clear" data-action="clear">AC</button>
    <button class="delete" data-action="delete">DEL</button>
    <button class="operator" data-action="operator" data-value="%">%</button>
    <button class="operator" data-action="operator" data-value="/">÷</button>

    <button data-action="number" data-value="7">7</button>
    <button data-action="number" data-value="8">8</button>
    <button data-action="number" data-value="9">9</button>
    <button class="operator" data-action="operator" data-value="*">×</button>

    <button data-action="number" data-value="4">4</button>
    <button data-action="number" data-value="5">5</button>
    <button data-action="number" data-value="6">6</button>
    <button class="operator" data-action="operator" data-value="-">−</button>

    <button data-action="number" data-value="1">1</button>
    <button data-action="number" data-value="2">2</button>
    <button data-action="number" data-value="3">3</button>
    <button class="operator" data-action="operator" data-value="+">+</button>

    <button class="zero" data-action="number" data-value="0">0</button>
    <button data-action="decimal">.</button>
    <button class="equals" data-action="equals">=</button>
  </div>
</div>

<script>
  const currentOperandEl = document.getElementById('currentOperand');
  const prevOperandEl = document.getElementById('prevOperand');

  let currentOperand = '0';
  let previousOperand = '';
  let operation = undefined;
  let shouldResetScreen = false;

  function updateDisplay() {
    currentOperandEl.textContent = currentOperand;
    prevOperandEl.textContent = previousOperand
      ? `${previousOperand} ${operatorSymbol(operation)}`
      : '';
  }

  function operatorSymbol(op) {
    return { '/': '÷', '*': '×', '-': '−', '+': '+', '%': '%' }[op] || '';
  }

  function appendNumber(number) {
    if (currentOperand === '0' || shouldResetScreen) {
      currentOperand = '';
      shouldResetScreen = false;
    }
    if (number === '.' && currentOperand.includes('.')) return;
    currentOperand += number;
  }

  function chooseOperator(op) {
    if (currentOperand === '') return;
    if (previousOperand !== '') {
      compute();
    }
    operation = op;
    previousOperand = currentOperand;
    shouldResetScreen = true;
  }

  function compute() {
    let result;
    const prev = parseFloat(previousOperand);
    const current = parseFloat(currentOperand);
    if (isNaN(prev) || isNaN(current)) return;
    switch (operation) {
      case '+': result = prev + current; break;
      case '-': result = prev - current; break;
      case '*': result = prev * current; break;
      case '/': result = current === 0 ? 'Error' : prev / current; break;
      case '%': result = prev % current; break;
      default: return;
    }
    currentOperand = (typeof result === 'number') ? roundResult(result) : result;
    operation = undefined;
    previousOperand = '';
    shouldResetScreen = true;
  }

  function roundResult(num) {
    return Math.round((num + Number.EPSILON) * 1e10) / 1e10;
    // avoids floating point artifacts like 0.1 + 0.2 = 0.30000000000000004
  }

  function clearAll() {
    currentOperand = '0';
    previousOperand = '';
    operation = undefined;
    shouldResetScreen = false;
  }

  function deleteLast() {
    if (shouldResetScreen) return;
    currentOperand = currentOperand.toString().slice(0, -1);
    if (currentOperand === '' || currentOperand === '-') currentOperand = '0';
  }

  document.querySelectorAll('button').forEach(button => {
    button.addEventListener('click', () => {
      const action = button.dataset.action;
      const value = button.dataset.value;

      if (action === 'number') appendNumber(value);
      else if (action === 'decimal') appendNumber('.');
      else if (action === 'operator') chooseOperator(value);
      else if (action === 'equals') compute();
      else if (action === 'clear') clearAll();
      else if (action === 'delete') deleteLast();

      updateDisplay();
    });
  });

  // Keyboard support
  window.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
    else if (e.key === '.') appendNumber('.');
    else if (['+', '-', '*', '/', '%'].includes(e.key)) chooseOperator(e.key);
    else if (e.key === 'Enter' || e.key === '=') compute();
    else if (e.key === 'Backspace') deleteLast();
    else if (e.key === 'Escape') clearAll();
    else return;
    updateDisplay();
  });

  updateDisplay();
</script>

</body>
</html>
